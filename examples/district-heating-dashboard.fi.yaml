# Replace sensor.salon_kaukolampo_ with your actual entity prefix if needed.
title: Kaukolämpö
views:
  - title: Kaukolämpö
    path: district-heating
    icon: mdi:radiator
    cards:
      - type: markdown
        content: |
          ## Kaukolämpö
          Vain seurantaan. Havaittu energiaresoluutio on 1 kWh.
          Tunnin keskiteho ei ole hetkellinen teho.
          Älä käytä viiveellisiä mittauksia yksin reaaliaikaiseen ohjaukseen tai turvatoimintoihin.
          Energiahistoria alkaa HA:n kirjatessa mittarin lukemia.
          Kulutuskuvaajat perustuvat kirjausaikoihin, eivät API:n alkuperäisiin mittausaikoihin.
      - type: entities
        title: Datan laatu
        show_header_toggle: false
        entities:
          - entity: sensor.salon_kaukolampo_data_quality
            name: Datan laatu
          - entity: sensor.salon_kaukolampo_reading_status
            name: Mittauksen tila
          - entity: sensor.salon_kaukolampo_measurement_time
            name: Uusin mittaus
          - entity: sensor.salon_kaukolampo_consumption_measurement_time
            name: Näytetyn kulutuksen mittausaika
      - type: entities
        title: Energia
        show_header_toggle: false
        entities:
          - entity: sensor.salon_kaukolampo_hourly_energy
            name: Viimeisin raportoitu tuntienergia
          - entity: sensor.salon_kaukolampo_hourly_average_power
            name: Viimeisin tunnin keskiteho
          - entity: sensor.salon_kaukolampo_total_energy
            name: Mittarin kokonaisenergia
      - type: entities
        title: Lämmönsiirto
        show_header_toggle: false
        entities:
          - entity: sensor.salon_kaukolampo_supply_temperature
            name: Menolämpötila
          - entity: sensor.salon_kaukolampo_return_temperature
            name: Paluulämpötila
          - entity: sensor.salon_kaukolampo_temperature_difference
            name: Lämpötilaero
          - entity: sensor.salon_kaukolampo_volume_flow
            name: Tilavuusvirta
      - type: picture-elements
        image: /local/salon_district_heating/heat-transfer-fi.svg
        elements:
          - type: state-label
            entity: sensor.salon_kaukolampo_supply_temperature
            style:
              left: 18.75%
              top: 25%
              color: "#ffffff"
              font-size: clamp(12px, 2.5vw, 20px)
              font-weight: bold
          - type: state-label
            entity: sensor.salon_kaukolampo_return_temperature
            style:
              left: 18.75%
              top: 83%
              color: "#ffffff"
              font-size: clamp(12px, 2.5vw, 20px)
              font-weight: bold
          - type: state-label
            entity: sensor.salon_kaukolampo_temperature_difference
            style:
              left: 50%
              top: 58%
              color: "#ffffff"
              font-size: clamp(12px, 2.5vw, 20px)
              font-weight: bold
          - type: state-label
            entity: sensor.salon_kaukolampo_volume_flow
            style:
              left: 81.25%
              top: 49%
              color: "#ffffff"
              font-size: clamp(12px, 2.5vw, 20px)
              font-weight: bold
      - type: statistics-graph
        title: Kirjattu tuntikulutus
        chart_type: bar
        period: hour
        days_to_show: 2
        stat_types:
          - change
        entities:
          - entity: sensor.salon_kaukolampo_total_energy
            name: Kirjattu kulutus
      - type: statistics-graph
        title: Kirjattu päiväkulutus
        chart_type: bar
        period: day
        days_to_show: 7
        stat_types:
          - change
        entities:
          - entity: sensor.salon_kaukolampo_total_energy
            name: Kirjattu kulutus
      - type: statistics-graph
        title: Kirjattu viikkokulutus
        chart_type: bar
        period: week
        days_to_show: 56
        stat_types:
          - change
        entities:
          - entity: sensor.salon_kaukolampo_total_energy
            name: Kirjattu kulutus
      - type: statistics-graph
        title: Kirjattu kuukausikulutus
        chart_type: bar
        period: month
        days_to_show: 365
        stat_types:
          - change
        entities:
          - entity: sensor.salon_kaukolampo_total_energy
            name: Kirjattu kulutus
      - type: history-graph
        title: Meno- ja paluulämpötilat
        hours_to_show: 48
        entities:
          - entity: sensor.salon_kaukolampo_supply_temperature
            name: Meno
          - entity: sensor.salon_kaukolampo_return_temperature
            name: Paluu
      - type: history-graph
        title: Lämpötilaero
        hours_to_show: 48
        entities:
          - entity: sensor.salon_kaukolampo_temperature_difference
            name: Lämpötilaero
      - type: history-graph
        title: Tilavuusvirta
        hours_to_show: 48
        entities:
          - entity: sensor.salon_kaukolampo_volume_flow
            name: Tilavuusvirta
      - type: entities
        title: API-diagnostiikka
        show_header_toggle: false
        entities:
          - entity: sensor.salon_kaukolampo_api_authentication_status
            name: Tunnistautumisen tila
          - entity: sensor.salon_kaukolampo_api_key_expiration
            name: Avaimen vanhenemispäivä
          - entity: sensor.salon_kaukolampo_api_key_days_remaining
            name: Päiviä jäljellä
          - entity: sensor.salon_kaukolampo_last_successful_api_request
            name: Viimeisin onnistunut API-kutsu
